[project]
name = "adit"
version = "0.1.0"
description = "A reachability engine: does a path exist from A to B, and what is it?"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    # Bolt client. HydraDB speaks Bolt 5.x, so the official Neo4j driver
    # connects to it unmodified -- see ARCHITECTURE.md section 8 on why Adit
    # stays a network client and never vendors the engine.
    "neo4j>=5.20",
    "httpx>=0.27",           # deps.dev / OSV / ecosyste.ms
    "tree-sitter>=0.21",     # stage A: TS/JS call graph extraction
    "tree-sitter-javascript>=0.21",
    "tree-sitter-typescript>=0.21",
    "mcp>=1.2",               # MCP server surface: adit-mcp
    "fastapi>=0.110",          # HTTP surface for a browser frontend: adit-api
    "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = ["ruff>=0.5"]

[project.scripts]
adit = "adit.cli:main"
adit-mcp = "adit.mcp_server:main"
adit-api = "adit.api:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/adit"]

[tool.ruff]
line-length = 96
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "S"]
